name: Integration Tests

on:
  workflow_dispatch:

jobs:
  integration-tests:
    name: Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PORT: 3000
      NODE_ENV: test
      CI: true
      TURBO_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: CI setup
        uses: ./.github/actions/ci-setup

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-browsers-v1-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: |
          cd apps/database
          supabase start --exclude realtime,imgproxy,studio,edge-runtime &

      - name: Install Playwright Chromium
        run: |
          cd apps/web
          pnpm exec playwright install chromium

      - name: Wait for Supabase
        run: |
          timeout=180
          counter=0
          until curl -s http://localhost:54321/rest/v1/ > /dev/null; do
            if [ $counter -eq $timeout ]; then
              echo "Timeout waiting for Supabase"
              exit 1
            fi
            counter=$((counter + 1))
            sleep 1
          done

      - name: Wait for Inbucket
        run: |
          timeout=180
          counter=0
          until curl -s http://localhost:54324 > /dev/null; do
            if [ $counter -eq $timeout ]; then
              echo "Timeout waiting for Inbucket"
              exit 1
            fi
            counter=$((counter + 1))
            sleep 1
          done

      - name: Build
        run: pnpm run build

      - name: Run integration tests
        run: pnpm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14
