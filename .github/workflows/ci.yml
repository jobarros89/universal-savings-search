name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: CI setup
        uses: ./.github/actions/ci-setup

      - name: Preview declarative database migration
        run: |
          cd apps/database
          pnpm exec supabase db diff -f ci_database_hardening
          migration_file="$(ls -t supabase/migrations/*_ci_database_hardening.sql | head -1)"
          echo "GENERATED_MIGRATION_FILE=$migration_file"
          echo "----- GENERATED MIGRATION START -----"
          cat "$migration_file"
          echo "----- GENERATED MIGRATION END -----"
          rm "$migration_file"

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test

      - name: Build
        run: pnpm run build
