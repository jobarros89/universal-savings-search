name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: CI setup
        uses: ./.github/actions/ci-setup

      - name: Verify declarative database schema
        run: |
          cd apps/database
          pnpm exec supabase db diff --schema public > /tmp/schema-diff.sql
          if [ -s /tmp/schema-diff.sql ]; then
            echo "Declarative schema and migrations are out of sync:"
            cat /tmp/schema-diff.sql
            exit 1
          fi

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test

      - name: Build
        run: pnpm run build
